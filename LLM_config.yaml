# Server & Port Configuration
server:
  host: "0.0.0.0"
  port: 8080

# Model Identity and Hardware (vLLM specific)
model:
  completion:
    model_id: "Qwen/Qwen2.5-Coder-1.5B"
    engine: "vllm"
    gpu_memory_utilization: 0.7
    dtype: "half" # Using float16 for the RTX 4060

# Global Inference Defaults (CompletionOptions)
inference:
  max_decoding_tokens: 128
  sampling_temperature: 0.2
  presence_penalty: 0.1
  seed: 42
  
  # ONLY Model-specific tokens. 
  # DO NOT put \ndef, \nclass, etc. here anymore.
